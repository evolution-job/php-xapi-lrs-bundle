# Agents
xapi_lrs.agent.get:
    path: /agents
    methods: [ GET, HEAD ]
    defaults:
        _controller: 'xapi_lrs.controller.agent.get::getAgent'
        xapi_lrs.route: true

# Agent Profile
xapi_lrs.agent.profile.get:
    path: /agents/profile
    methods: [ GET, HEAD ]
    defaults: { _controller: 'xapi_lrs.controller.profile.get::getAgentProfile', xapi_lrs.route: true }
xapi_lrs.agent.profile.post:
    path: /agents/profile
    methods: [ POST ]
    defaults: { _controller: 'xapi_lrs.controller.profile.post::postAgentProfile', xapi_lrs.route: true }
xapi_lrs.agent.profile.put:
    path: /agents/profile
    methods: [ PUT ]
    defaults: { _controller: 'xapi_lrs.controller.profile.put::putAgentProfile', xapi_lrs.route: true }
xapi_lrs.agent.profile.delete:
    path: /agents/profile
    methods: [ DELETE ]
    defaults: { _controller: 'xapi_lrs.controller.profile.delete::deleteAgentProfile', xapi_lrs.route: true }
xapi_lrs.agent.profile.options:
    path: /agents/profile
    methods: [ OPTIONS ]
    defaults: { _controller: 'xapi_lrs.controller.profile.options::optionsProfiles', xapi_lrs.route: true }

